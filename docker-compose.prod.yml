# Docker Compose de HOMOLOGAÇÃO/PRODUÇÃO ENXUTA (VPS única: Contabo Cloud VPS 6 =
# 6 vCPU / ~11 GiB RAM / 193 GB / swap 4 GB). Os tetos de memória abaixo foram dimensionados
# para essa máquina (ver docs/DOCKER-DEPLOYMENT.md §8) e continuam funcionando em 8 GB.
#
# IMAGENS: na VPS o deploy automático (GitHub Actions, por tag) exporta BACKEND_IMAGE e
# FRONTEND_IMAGE apontando para o GHCR (ghcr.io/<repo>/backend:vX.Y.Z) e NADA é construído
# lá. Sem essas variáveis (uso local/simulação) o compose constrói as imagens do código.
#
# IMPORTANTE: `name:` fixa o projeto como "radar-prod" para que os volumes sejam
# radar-prod_* e NUNCA colidam com os volumes do ambiente de desenvolvimento
# (radar-leilao_*), que guardam o histórico (imóvel 633 etc.).
#
# Uso (ver docs/DOCKER-DEPLOYMENT.md): NÃO chame `docker compose` direto na VPS; use
#   scripts/prod/compose.sh <args>   (carrega .env.prod + .release.env = imagens da versão atual)
# e faça deploys pelo GitHub Actions (tag vX.Y.Z) ou por scripts/prod/deploy.sh.
name: radar-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-radar_leilao}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-radar_leilao}
  POSTGRES_USER: ${POSTGRES_USER:-radar}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  STORAGE_DIR: /app/backend/storage/documents
  # Temporários de processamento ficam no volume (não enchem o disco do container).
  TMPDIR: /app/backend/storage/tmp
  OCR_ENABLED: ${OCR_ENABLED:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  # LLM: provider/modelo explícitos e resiliência configurável (timeout por chamada e
  # retries do SDK). O padrão da biblioteca (~600 s) excederia o proxy_read_timeout (300 s).
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
  # Limites de upload e proteção contra consumo indevido (ver docs/03-architecture/security.md).
  UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-30}
  RATE_LIMIT_CRITICAL_PER_MINUTE: ${RATE_LIMIT_CRITICAL_PER_MINUTE:-10}
  RATE_LIMIT_UPLOAD_PER_MINUTE: ${RATE_LIMIT_UPLOAD_PER_MINUTE:-30}
  MAX_CONCURRENT_CRITICAL_PER_USER: ${MAX_CONCURRENT_CRITICAL_PER_USER:-2}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: radar-prod-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radar_leilao}
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.prod}
    # Ajuste para ~11 GiB de RAM na máquina (teto do container: 2 GB; ~25-40% em
    # shared_buffers). Banco pequeno (MVP ~150 MB de dados): folga, não consumo. Sem `ports`.
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=40
      - -c
      - log_min_duration_statement=2000
    mem_limit: 2g
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar} -d ${POSTGRES_DB:-radar_leilao}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Migração CONTROLADA (one-shot, profile). Ver docs/DOCKER-DEPLOYMENT.md.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    image: ${BACKEND_IMAGE:-radar-leilao-backend-prod:latest}
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *backend-env
    entrypoint: ["/bin/sh", "-c"]
    command: ["cd /app/backend && alembic current && alembic upgrade head && alembic current"]
    networks: [internal]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    image: ${BACKEND_IMAGE:-radar-leilao-backend-prod:latest}
    container_name: radar-prod-backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-false}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?defina JWT_SECRET_KEY no .env.prod}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:-}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}
    mem_limit: 2g
    volumes:
      - backend_storage:/app/backend/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [internal]

  # Worker de embeddings pendentes (DB-backed). Passa pelo MESMO entrypoint do backend,
  # portanto também recusa subir com schema incompatível.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    image: ${BACKEND_IMAGE:-radar-leilao-backend-prod:latest}
    container_name: radar-prod-worker
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-30}
      WORKER_BATCH_LIMIT: ${WORKER_BATCH_LIMIT:-5}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
      RUN_MIGRATIONS_ON_START: "false"
    mem_limit: 1g
    volumes:
      - backend_storage:/app/backend/storage
    command: ["python", "-m", "app.worker_main"]
    networks: [internal]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        # VAZIO de propósito: os serviços do frontend já usam caminhos /api/...
        # relativos ao mesmo host (atrás do proxy). Nunca localhost.
        VITE_API_URL: ""
    image: ${FRONTEND_IMAGE:-radar-leilao-frontend-prod:latest}
    container_name: radar-prod-frontend
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    networks: [internal]

  # Proxy: ÚNICO ponto exposto. Portão de acesso por chave (cookie) para homologação
  # por IP (ver docs/HOMOLOGATION-GUIDE.md). Template processado por envsubst.
  proxy:
    image: nginx:1.27-alpine
    container_name: radar-prod-proxy
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - frontend
      - backend
    environment:
      GATE_KEY: ${GATE_KEY:?defina GATE_KEY (>=24 caracteres) no .env.prod}
    mem_limit: 64m
    ports:
      # Padrão SEGURO: 127.0.0.1 (só local; acesso remoto via `tailscale serve`).
      # ATENÇÃO: porta publicada pelo Docker em 0.0.0.0 IGNORA o UFW (regras próprias de
      # iptables). Use 0.0.0.0 apenas conscientemente (modo A, HTTP em texto claro).
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/_proxy_health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [internal]

volumes:
  postgres_data:
  backend_storage:

networks:
  internal:
    driver: bridge
