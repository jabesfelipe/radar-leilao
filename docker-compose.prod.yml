# Docker Compose de PRODUÇÃO do Radar Leilão.
#
# Diferenças vs. docker-compose.yml (dev):
# - PostgreSQL NÃO publica porta no host (só acessível na rede interna).
# - Backend/Frontend usam Dockerfiles de produção (não-root, nginx, sem auto-migrate).
# - Serviço `migrate` dedicado (one-shot) aplica Alembic de forma CONTROLADA — ver
#   docs/DATABASE-MIGRATION.md. O backend NÃO migra sozinho no start.
# - Proxy reverso (nginx) é o único ponto exposto (80/443, HTTPS).
#
# Variáveis vêm de um arquivo .env de produção (NUNCA versionado). Ver .env.prod.example.
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   (migração controlada) docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: radar-prod-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radar_leilao}
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.prod}
    # Sem `ports`: o banco NÃO é exposto à internet. Acesso só pela rede interna.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar} -d ${POSTGRES_DB:-radar_leilao}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Migração CONTROLADA (one-shot). Não sobe junto com `up` normal: usar o profile.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    image: radar-leilao-backend-prod:latest
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-radar_leilao}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-radar_leilao}
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command: ["cd /app/backend && alembic current && alembic upgrade head && alembic current"]
    networks: [internal]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    image: radar-leilao-backend-prod:latest
    container_name: radar-prod-backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-radar_leilao}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-radar_leilao}
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-false}
      # Produção: segredo JWT obrigatório (falha-fechada sem ele).
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?defina JWT_SECRET_KEY no .env.prod}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      # CORS: domínio público do frontend (ex.: https://app.exemplo.com).
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-https://localhost}
      # Storage: local (default) ou s3/minio (ver .env.prod.example).
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_DIR: /app/backend/storage/documents
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      # LLM opcional (sem chave, RAG degrada para texto; nunca simula).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      # Bootstrap opcional do 1º admin (idempotente).
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:-}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - backend_storage:/app/backend/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [internal]

  # Worker de processamento assíncrono de documentos (embeddings pendentes).
  # DB-backed (sem Redis): faz polling das versões pendentes e processa idempotente.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    image: radar-leilao-backend-prod:latest
    container_name: radar-prod-worker
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-radar_leilao}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-radar_leilao}
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-30}
      WORKER_BATCH_LIMIT: ${WORKER_BATCH_LIMIT:-10}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_DIR: /app/backend/storage/documents
    volumes:
      - backend_storage:/app/backend/storage
    # Não aplica migrations; apenas processa a fila. Entrypoint próprio do worker.
    entrypoint: ["/bin/sh", "-c"]
    command: ["cd /app/backend && python -m app.worker_main"]
    networks: [internal]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        # Em produção o frontend chama a API via mesmo domínio atrás do proxy (/api).
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: radar-leilao-frontend-prod:latest
    container_name: radar-prod-frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    networks: [internal]

  proxy:
    image: nginx:1.27-alpine
    container_name: radar-prod-proxy
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot
    networks: [internal]

volumes:
  postgres_data:
  backend_storage:
  certbot_www:

networks:
  internal:
    driver: bridge
