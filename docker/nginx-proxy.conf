# Proxy reverso (produção) — único ponto exposto à internet.
# Roteia: /api -> backend:8000 ; / -> frontend:8080. HTTPS termina AQUI.
#
# Este arquivo é um TEMPLATE: ajuste server_name e os caminhos dos certificados.
# Para HTTPS em VPS, use certbot/Let's Encrypt (ver docs/DEPLOYMENT.md) e monte os
# certificados em /etc/nginx/certs. O PostgreSQL NUNCA é exposto por aqui.

upstream radar_backend { server backend:8000; }
upstream radar_frontend { server frontend:8080; }

# Redirect HTTP -> HTTPS (habilite quando os certificados existirem).
server {
    listen 80;
    server_name _;
    # Desafio ACME (certbot) servido direto, sem redirect.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name _;  # troque pelo domínio real (ex.: app.exemplo.com)

    # Certificados (ajuste os caminhos). Em VPS, apontar para os emitidos pelo certbot.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50m;  # uploads de documentos (PDF)

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API: preserva prefixo /api (as rotas do backend já começam com /api).
    location /api/ {
        proxy_pass http://radar_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Health do backend (sem /api) para probes externos, opcional.
    location = /health {
        proxy_pass http://radar_backend/health;
        proxy_set_header Host $host;
    }

    # Frontend (SPA).
    location / {
        proxy_pass http://radar_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
