# Nginx do frontend (produção) — serve o build estático do Vite com roteamento SPA,
# cache de assets e proxy opcional para a API. HTTPS é terminado no proxy reverso
# externo (ver docker/nginx-proxy). Este nginx serve apenas o frontend.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Segurança básica de cabeçalhos (sem quebrar o SPA).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Assets com hash no nome: cache agressivo e imutável.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca em cache (garante pegar o build novo após deploy).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Roteamento SPA: qualquer rota desconhecida cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck leve do próprio nginx.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
