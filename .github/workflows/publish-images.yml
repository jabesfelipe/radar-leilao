name: Publish images (GHCR, manual)

# Publica as imagens de produção no GitHub Container Registry. Somente manual
# (workflow_dispatch) ou em tag vX.Y.Z — nunca em push de branch comum.
# Usa o GITHUB_TOKEN automático (sem secrets criadas à mão).

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        run: echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.tag }}
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile.prod
          build-args: VITE_API_URL=
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.tag }}
