name: Deploy (manual)

# Deploy CONTROLADO para a VPS. NUNCA dispara em push: somente "Run workflow"
# manual, e o job usa o Environment "production" (configure "Required reviewers" no
# GitHub para exigir aprovação). Nada é executado até as secrets existirem.
#
# Secrets/variáveis necessárias (Settings > Environments > production):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY (chave privada dedicada ao deploy), VPS_PORT (opcional),
#   VPS_APP_DIR (ex.: /opt/radar-leilao)
# Ver docs/GITHUB-ACTIONS-DEPLOY.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag/commit a implantar (ex.: v0.1.0 ou SHA). Padrão: main"
        required: false
        default: main
      mode:
        description: "update (instalação existente) | rollback (voltar para 'ref')"
        required: true
        default: update
        type: choice
        options: [update, rollback]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validar secrets
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          for v in HOST USER_ KEY DIR; do
            if [ -z "${!v}" ]; then echo "Secret ausente: $v"; exit 1; fi
          done

      - name: Configurar SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy (build na VPS, backup + migração controlada + smoke)
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
          DIR: ${{ secrets.VPS_APP_DIR }}
          REF: ${{ inputs.ref }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" "$USER_@$HOST" \
            "set -euo pipefail; cd '$DIR'; git fetch --tags origin; git checkout '$REF'; \
             if git rev-parse --verify -q 'origin/$REF' >/dev/null; then git reset --hard 'origin/$REF'; fi; \
             scripts/prod/deploy.sh update"

      - name: Registrar resultado
        if: always()
        run: echo "Deploy ref=${{ inputs.ref }} mode=${{ inputs.mode }} status=${{ job.status }}"
