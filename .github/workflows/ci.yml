name: CI

# Integração contínua do Radar Leilão.
# - backend: PostgreSQL+pgvector descartável, migrations 0001->head (+ downgrade -1/upgrade),
#   pytest (inclui contrato OpenAPI, storage/download/worker e a política dos workflows).
# - frontend: tsc + vitest.
# - docker: valida o compose de produção, o nginx do proxy e a sintaxe dos scripts; constrói
#   as imagens de produção (sem publicar).
# Roda em push/PR na main e é REUTILIZADO pelo pipeline de release (release.yml), que o
# chama antes de publicar/implantar uma tag. Este workflow nunca publica nem implanta.
# Sem secrets reais; LLM/integrações externas desligadas.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      skip_image_build:
        description: "Pula o build de teste das imagens (o release já as constrói e publica)."
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (migrations + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://radar:radar@localhost:5432/radar_test
      RAG_TEST_DATABASE_URL: postgresql+psycopg://radar:radar@localhost:5432/radar_test
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Enable pgvector extension
        env:
          PGPASSWORD: radar
        run: psql -h localhost -U radar -d radar_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Apply migrations (0001 -> head)
        working-directory: backend
        run: alembic upgrade head
      - name: Migrations are reversible (downgrade -1 / upgrade head)
        working-directory: backend
        run: alembic downgrade -1 && alembic upgrade head
      - name: Run backend test suite
        run: pytest -q tests

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check (tsc)
        working-directory: frontend
        run: npx tsc -b
      - name: Run frontend tests (vitest)
        working-directory: frontend
        run: npm test

  docker:
    name: Docker (compose + proxy + scripts + build prod)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose (build mode and published-image mode)
        run: |
          printf 'POSTGRES_PASSWORD=ci\nJWT_SECRET_KEY=ci\nGATE_KEY=ci-gate-key-0123456789abcd\n' > /tmp/ci.env
          docker compose -f docker-compose.prod.yml --env-file /tmp/ci.env config > /dev/null
          BACKEND_IMAGE=registry.example/o/r/backend:v1.0.0 FRONTEND_IMAGE=registry.example/o/r/frontend:v1.0.0 \
            docker compose -f docker-compose.prod.yml --env-file /tmp/ci.env config | grep -E 'image: registry.example/o/r/(backend|frontend):v1.0.0' | sort -u
      - name: Validate proxy config with a real-size GATE_KEY (48 hex) and script syntax
        run: |
          for f in scripts/prod/*.sh docker/*.sh; do bash -n "$f"; done
          docker run --rm -e GATE_KEY="$(openssl rand -hex 24)" \
            --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 \
            -v "$PWD/docker/nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            nginx:1.27-alpine /docker-entrypoint.sh nginx -t
      - name: Lint workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Build production images (no push)
        if: ${{ inputs.skip_image_build != true }}
        run: |
          docker build -f backend/Dockerfile.prod -t radar-backend-prod:ci .
          docker build -f frontend/Dockerfile.prod -t radar-frontend-prod:ci .
