name: CI

# Integração contínua do Radar Leilão.
# - backend: PostgreSQL+pgvector descartável, migrations 0001->head, pytest (inclui
#   contrato OpenAPI e testes de storage/download/worker).
# - frontend: tsc + vitest.
# - docker: valida o compose de produção (config) e faz BUILD das imagens de produção
#   (sem publicar). A publicação no GHCR acontece somente no workflow de deploy manual.
# Sem secrets reais; LLM/integrações externas desligadas.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (migrations + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://radar:radar@localhost:5432/radar_test
      RAG_TEST_DATABASE_URL: postgresql+psycopg://radar:radar@localhost:5432/radar_test
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Enable pgvector extension
        env:
          PGPASSWORD: radar
        run: psql -h localhost -U radar -d radar_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Apply migrations (0001 -> head)
        working-directory: backend
        run: alembic upgrade head
      - name: Migrations are reversible (downgrade -1 / upgrade head)
        working-directory: backend
        run: alembic downgrade -1 && alembic upgrade head
      - name: Run backend test suite
        run: pytest -q tests

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check (tsc)
        working-directory: frontend
        run: npx tsc -b
      - name: Run frontend tests (vitest)
        working-directory: frontend
        run: npm test

  docker:
    name: Docker (compose config + build prod)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose
        run: |
          printf 'POSTGRES_PASSWORD=ci\nJWT_SECRET_KEY=ci\nGATE_KEY=ci-gate-key-0123456789abcd\n' > /tmp/ci.env
          docker compose -f docker-compose.prod.yml --env-file /tmp/ci.env config > /dev/null
      - name: Build production images (no push)
        run: |
          docker build -f backend/Dockerfile.prod -t radar-backend-prod:ci .
          docker build -f frontend/Dockerfile.prod -t radar-frontend-prod:ci .
