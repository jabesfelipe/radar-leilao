services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: radar-leilao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: radar_leilao
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar_leilao"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro

volumes:
  postgres_data:
